name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -ex  # Enable debugging and exit on error
          aws --version
          aws s3 ls s3://duodat.com --region eu-west-3
          # Run AWS CLI command and capture the output and error
          aws s3 sync output_duodat.com s3://duodat.com --region eu-west-3